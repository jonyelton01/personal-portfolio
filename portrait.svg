<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-label="Portrait placeholder">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b0866"/>
      <stop offset="45%" stop-color="#c81d77"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#fff7ad" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ff3cac" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#12081f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="800" fill="url(#sky)"/>
  <circle cx="320" cy="280" r="220" fill="url(#glow)"/>
  <ellipse cx="320" cy="250" rx="92" ry="110" fill="#1a0b2e"/>
  <ellipse cx="320" cy="520" rx="160" ry="200" fill="#1a0b2e"/>
